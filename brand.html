<title>LiveQue - Logo lab</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0F12;color:#E8EDF0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;gap:34px}
.tag{color:#8A949C;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.hero{width:min(680px,92vw);height:auto;overflow:visible}

/* SEQUENCE:
   0.0-0.3s  nothing - dot sits hidden behind the i stem (drawn under the text)
   0.3-1.2s  the rise: dot slides up from behind the letters, small overshoot,
             lands in the real tittle position
   1.5s+     the transmitter: dot beats, three half-circle arcs emit from its
             center, staggered so the signal never stops                    */
.dotg{transform-box:fill-box;transform-origin:center;
      animation: rise .9s cubic-bezier(.2,.8,.25,1.08) .3s both,
                 beat 1.7s ease-in-out 1.6s infinite}
@keyframes rise{from{transform:translateY(52px)}to{transform:translateY(0)}}
@keyframes beat{0%,100%{transform:scale(1)}4%{transform:scale(1.14)}12%{transform:scale(1)}}
/* radar transmitter: rings are dark between pulses. Each cycle the ping
   travels outward - ring 1 flashes and fades off, then 2, then 3 - and
   everything sits at zero until the next pulse. */
.em{opacity:0}
.e1{animation:boop1 1.7s ease-in-out 1.6s infinite}
.e2{animation:boop2 1.7s ease-in-out 1.6s infinite}
.e3{animation:boop3 1.7s ease-in-out 1.6s infinite}
@keyframes boop1{0%{opacity:0}12%{opacity:.95}58%{opacity:0}100%{opacity:0}}
@keyframes boop2{0%,7%{opacity:0}21%{opacity:.95}68%{opacity:0}100%{opacity:0}}
@keyframes boop3{0%,15%{opacity:0}31%{opacity:.9}78%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .dotg,.em{animation:none}
  .e1{opacity:.6}.e2{opacity:.35}.e3{opacity:.18}
}
.replay{background:#11161C;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#E8EDF0;font-size:13px;font-weight:600;padding:10px 18px;cursor:pointer}
.replay:hover{border-color:#17B7AE;color:#4ECDC4}
.chip{background:#fff;border-radius:16px;padding:26px 34px;width:min(680px,92vw)}
.chip svg{width:100%;height:auto}
.note{color:#8A949C;font-size:13px;text-align:center;max-width:540px;line-height:1.6}
</style>
</head>
